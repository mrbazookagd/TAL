<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-logo">THE WAVE LIST</div>
        <div>
            <a href="submit.html" class="nav-link" style="margin-right: 20px;">SUBMIT</a>
            <a href="roulette.html" class="nav-link" style="margin-right: 20px;">ROULETTE</a>
            <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
        </div>
    </nav>

    <div class="main-layout">
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div style="position: sticky; top: 0; z-index: 10; background: rgba(20, 22, 30, 0.95); padding-bottom: 10px;">
                <input type="text" id="level-search" placeholder="Search levels..." oninput="filterLevels()" style="width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; box-sizing: border-box; transition: border-color 0.2s ease;" onfocus="this.style.borderColor='var(--accent, #47e5bc)'" onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
            </div>
            <div class="sidebar" id="sidebar"></div>
        </div>

        <div class="content">
            <div style="display: flex; gap: 30px; width: 100%; max-width: 1650px; align-items: flex-start;">
                
                <div class="glass-card" style="flex: 1; max-width: 1150px; margin: 0;">
                    <div class="video-box">
                        <iframe id="main-vid" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <h1 id="main-title" style="margin:0; font-size: 1.5rem;"></h1>
                    <div class="info-grid">
                        <div class="stat-card"><div class="stat-label">Creator</div><div id="s-creator">-</div></div>
                        <div class="stat-card"><div class="stat-label">Verifier</div><div id="s-verifier">-</div></div>
                        <div class="stat-card"><div class="stat-label">ID</div><div id="s-id">-</div></div>
                        <div class="stat-card"><div class="stat-label">Points</div><div id="s-pts" style="color:var(--accent)">-</div></div>
                    </div>
                    <div class="victors-box">
                        <div class="stat-label">List Victors</div>
                        <div id="v-cont" style="margin-top:10px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
                    </div>
                </div>

                <div id="tier-legend-container" style="width: 340px; min-width: 340px; background: rgba(20, 22, 30, 0.95); border: 1px solid var(--border); border-radius: 12px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: sticky; top: 0px;">
                    <div class="stat-label" style="margin-bottom: 20px; font-weight:700; font-size: 0.95rem; letter-spacing:1px;">TIER LEGEND</div>
                    <div id="legend-list"></div>
                </div>

            </div>
        </div>
    </div>

    <a href="rules.html" style="position: fixed; bottom: 25px; right: 90px; width: 56px; height: 56px; background: rgba(30, 34, 45, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 9999; transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;" onmouseover="this.style.transform='scale(1.1)'; this.style.borderColor='var(--accent, #47e5bc)'; this.style.backgroundColor='rgba(40, 45, 60, 0.9)';" onmouseout="this.style.transform='scale(1)'; this.style.borderColor='rgba(255, 255, 255, 0.1)'; this.style.backgroundColor='rgba(30, 34, 45, 0.9)';">
        <span style="font-size: 1.5rem; user-select: none;">📜</span>
    </a>

    <a href="https://discord.com/invite/7SjKU8vy8x" target="_blank" style="position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px; background: #5865F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 9999; transition: transform 0.2s ease, background-color 0.2s ease;" onmouseover="this.style.transform='scale(1.1)'; this.style.backgroundColor='#4752C4';" onmouseout="this.style.transform='scale(1)'; this.style.backgroundColor='#5865F2';">
        <img src="discord.png" alt="Discord" style="width: 28px; height: 28px; object-fit: contain;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'%23ffffff\'><path d=\'M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.298 12.298 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z\'/></svg>';">
    </a>

    <script>
        // --- LOGO CONFIGURATION ---
        const TIER_LOGO_SIZE = "36px"; 
        // ---------------------------

        let allLevels = [];
        let allTiers = [];

        async function init() {
            try {
                const resTiers = await fetch(`tiers.json?v=${new Date().getTime()}`);
                allTiers = await resTiers.json();

                const res = await fetch(`levels.json?v=${new Date().getTime()}`);
                allLevels = await res.json();

                allLevels.sort((a, b) => b.points - a.points);

                renderSidebar(allLevels);

                const legendList = document.getElementById('legend-list');
                let legendHTML = "";
                
                [...allTiers].reverse().forEach(t => {
                    const logoSrc = t.image ? t.image : ''; 
                    const manualScale = t.size ? t.size : "100%";

                    legendHTML += `
                        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-size: 1rem;">
                            <div style="width: ${TIER_LOGO_SIZE}; height: ${TIER_LOGO_SIZE}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <img src="${logoSrc}" style="width: ${manualScale}; height: ${manualScale}; object-fit: contain; aspect-ratio: 1 / 1;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23333\' stroke-width=\'1.5\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/></svg>';">
                            </div>
                            <span style="font-weight: 700; color: ${t.color}">${t.name}</span>
                            <span style="color: #888; margin-left: auto; font-size: 0.9rem; font-weight: 500;">${t.minPoints}${t.maxPoints > 9000 ? '+' : ' - ' + t.maxPoints} PTS</span>
                        </div>
                    `;
                });
                legendList.innerHTML = legendHTML;

                if(allLevels.length > 0) update(allLevels[0], 1);
            } catch(e) {
                console.error("Error loading levels layout:", e);
                document.getElementById('main-title').innerText = "Error loading list records.";
            }
        }

        function renderSidebar(levelsToRender) {
            const side = document.getElementById('sidebar');
            side.innerHTML = ""; 

            if (levelsToRender.length === 0) {
                side.innerHTML = `<div style="color: #666; font-size: 0.85rem; padding: 10px; text-align: center;">No levels found</div>`;
                return;
            }

            levelsToRender.forEach((lvl) => {
                const rank = allLevels.indexOf(lvl) + 1;

                if (rank === 1) {
                    const header = document.createElement('div');
                    header.style.cssText = "font-weight: 800; font-size: 0.9rem; color: var(--accent, #47e5bc); letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;";
                    header.innerText = "Main List";
                    side.appendChild(header);
                } else if (rank === 76) {
                    const header = document.createElement('div');
                    header.style.cssText = "font-weight: 800; font-size: 0.9rem; color: #aaa; letter-spacing: 1.5px; text-transform: uppercase; padding: 18px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;";
                    header.innerText = "Extended List";
                    side.appendChild(header);
                } else if (rank === 151) {
                    const legacyContainer = document.createElement('div');
                    legacyContainer.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 18px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;";
                    
                    const header = document.createElement('div');
                    header.style.cssText = "font-weight: 800; font-size: 0.9rem; color: #666; letter-spacing: 1.5px; text-transform: uppercase;";
                    header.innerText = "Legacy List";
                    
                    const btn = document.createElement('a');
                    btn.href = "legacy.html";
                    btn.innerText = "VIEW ALL";
                    btn.style.cssText = "font-size: 0.7rem; font-weight: 700; color: var(--accent, #47e5bc); text-decoration: none; border: 1px solid var(--accent, #47e5bc); padding: 3px 8px; border-radius: 4px; transition: all 0.2s ease;";
                    btn.onmouseover = () => { btn.style.background = 'var(--accent, #47e5bc)'; btn.style.color = '#000'; };
                    btn.onmouseout = () => { btn.style.background = 'transparent'; btn.style.color = 'var(--accent, #47e5bc)'; };

                    legacyContainer.appendChild(header);
                    legacyContainer.appendChild(btn);
                    side.appendChild(legacyContainer);
                }

                const displayPts = rank > 150 ? "LEGACY" : `${lvl.points} PTS`;

                const div = document.createElement('div');
                div.className = `list-item ${rank <= 3 ? 'top-'+rank : ''}`;
                
                div.style.display = "flex";
                div.style.alignItems = "center";
                div.style.gap = "12px";
                
                const currentTier = allTiers.find(t => lvl.points >= t.minPoints && lvl.points <= t.maxPoints);
                if (currentTier) {
                    div.style.borderLeft = `4px solid ${currentTier.color}`;
                }
                
                const imgSource = lvl.thumbnail ? lvl.thumbnail : "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

                div.innerHTML = `
                    <div class="rank" style="${currentTier ? 'color:' + currentTier.color : ''}; flex-shrink: 0; min-width: 35px;">#${rank}</div>
                    <img src="${imgSource}" class="thumb-mini" style="width: 80px; height: 45px; object-fit: cover; flex-shrink: 0; border-radius: 4px;">
                    <div style="flex: 1; min-width: 0; overflow: hidden; text-align: left;">
                        <div style="font-weight:700; font-size:0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${lvl.name}</div>
                        <div style="font-size:0.7rem; color:#666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${displayPts}</div>
                    </div>
                `;
                div.onclick = () => update(lvl, rank);
                side.appendChild(div);
            });
        }

        function filterLevels() {
            const query = document.getElementById('level-search').value.toLowerCase().trim();
            const filtered = allLevels.filter(lvl => lvl.name.toLowerCase().includes(query));
            renderSidebar(filtered);
        }

        function update(lvl, rank) {
            document.getElementById('main-title').innerText = `#${rank} - ${lvl.name}`;
            document.getElementById('s-creator').innerText = lvl.creator;
            
            document.getElementById('s-verifier').innerHTML = `<a href="player.html?name=${encodeURIComponent(lvl.verifier)}" class="player-link">${lvl.verifier}</a>`;
            
            document.getElementById('s-id').innerText = lvl.id;
            document.getElementById('s-pts').innerText = rank > 150 ? "LEGACY" : lvl.points;

            const vid = document.getElementById('main-vid');
            if (lvl.video) {
                if (lvl.video.includes('medal')) {
                    vid.src = `https://medal.tv/clip/${lvl.video.split('/').pop()}`;
                } else if (lvl.video.includes('youtube.com/watch?v=')) {
                    const urlParams = new URLSearchParams(lvl.video.split('?')[1]);
                    vid.src = `https://www.youtube.com/embed/${urlParams.get('v')}`;
                } else if (lvl.video.includes('youtu.be/')) {
                    vid.src = `https://www.youtube.com/embed/${lvl.video.split('/').pop()}`;
                } else {
                    vid.src = `https://www.youtube.com/embed/${lvl.video}`;
                }
            } else {
                vid.src = '';
            }

            const validVictors = lvl.victors ? lvl.victors.filter(v => v.trim() !== "") : [];

            const vCont = document.getElementById('v-cont');
            vCont.innerHTML = validVictors.length > 0 
                ? validVictors.map(v => `<a href="player.html?name=${encodeURIComponent(v)}" class="tag player-link" style="white-space: nowrap; display: inline-block; text-decoration: none;">${v}</a>`).join('') 
                : "<span style='color:#444; font-size:0.8rem'>No victors yet.</span>";
        }
        init();
    </script>
</body>
</html>
